name: Deploy THE SYSTEM to GitHub Pages

# Deploys the app (static files) to GitHub Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# After that, every push to main (or a manual run) publishes the app.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root (index.html, manifest.json, sw.js, icons/).
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
